<script>
(function(){
  var KEY="lang",TAG={ko:"ko",zh:"zh-CN",ja:"ja"};
  function set(l){
    if(!TAG[l])l="ko";
    document.querySelectorAll("[data-"+l+"]").forEach(function(el){el.textContent=el.getAttribute("data-"+l);el.lang=TAG[l];});
    document.querySelectorAll(".langs button").forEach(function(b){b.classList.toggle("on",b.dataset.lang===l);});
    try{l==="ko"?localStorage.removeItem(KEY):localStorage.setItem(KEY,l);}catch(e){}
  }
  document.addEventListener("click",function(e){var b=e.target.closest(".langs button");if(b)set(b.dataset.lang);});
  var saved="";try{saved=localStorage.getItem(KEY)||"";}catch(e){}
  if(saved)set(saved);
})();
</script>
