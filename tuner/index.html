<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1c">
<title>B♭ 트럼펫 튜너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 한 화면. 가운데에 음이름을 최대 크기로, 그 아래 센트 게이지.
   상태(낮음/정확/높음)는 글자색과 화면 테두리 색으로 동시에 표시해 멀리서도 구분된다.
   녹음 자세히 보기는 화면 전체를 덮는 별도 화면이다. */
:root {
  color-scheme: dark;
  --ink: #0a0f1c;
  --panel: #141b2e;
  --line: #2a3552;
  --text: #f3f1ea;
  --muted: #94a0bd;
  --brass: #f2b632;
  --ok: #3ddc97;
  --flat: #5aa9ff;
  --sharp: #ff7a59;
  --state: var(--muted);
  --display: "Barlow Condensed", "Arial Narrow", "Apple SD Gothic Neo", sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--body);
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px)
           calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 16px);
  overflow-x: hidden; overflow-y: auto;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  box-shadow: inset 0 0 0 0 var(--state);
  transition: box-shadow .15s linear;
}
body[data-state="flat"]  { --state: var(--flat); }
body[data-state="ok"]    { --state: var(--ok); }
body[data-state="sharp"] { --state: var(--sharp); }
body[data-state="flat"], body[data-state="ok"], body[data-state="sharp"] {
  box-shadow: inset 0 0 0 8px var(--state);
}
[hidden] { display: none !important; }

/* 상단 설정 */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px 10px; flex-wrap: wrap; }
.brand { font-size: .8rem; letter-spacing: .14em; color: var(--brass); font-weight: 700; white-space: nowrap; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
.chip, .stepper {
  min-height: 44px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 12px; font: inherit; font-size: .9rem;
}
.chip { padding: 0 13px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }
.stepper { display: flex; align-items: center; overflow: hidden; }
.stepper button {
  width: 40px; height: 44px; border: 0; background: transparent; color: var(--text);
  font-size: 1.3rem; cursor: pointer;
}
.stepper output { min-width: 4.4em; text-align: center; font-variant-numeric: tabular-nums; }
button:focus-visible, select:focus-visible, summary:focus-visible, .handle:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* 가운데 표시부 */
.stage { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 2vh; }
.readout { text-align: center; min-width: 0; }
.note {
  font-family: var(--display); font-weight: 700; line-height: .82;
  font-size: clamp(6rem, min(50vw, 28vh), 24rem);
  color: var(--state);
  display: inline-flex; align-items: flex-start; justify-content: center;
  font-variant-numeric: tabular-nums;
}
.note.ko { font-family: var(--body); font-weight: 800; line-height: 1; font-size: calc(clamp(6rem, min(50vw, 28vh), 24rem) * .8); }
.note .acc { font-family: var(--body); font-weight: 700; font-size: .42em; line-height: 1; margin-top: .1em; min-width: .55em; text-align: left; }
.note .oct { font-family: var(--display); font-size: .3em; line-height: 1; align-self: flex-end; margin-bottom: .16em; color: var(--muted); min-width: .5em; text-align: left; }
.note.ko .oct { font-size: .36em; margin-bottom: .22em; }
.sub { margin-top: 1.2vh; color: var(--muted); font-size: clamp(.95rem, 2.4vh, 1.3rem); font-variant-numeric: tabular-nums; }

.gauge { min-width: 0; }
.verdict-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.verdict { font-size: clamp(1.5rem, 4.6vh, 3rem); font-weight: 800; color: var(--state); }
.cents { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 6vh, 4.2rem); line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; }
.cents small { font-size: .4em; color: var(--muted); margin-left: .25em; font-family: var(--body); font-weight: 400; }
.track {
  position: relative; height: clamp(40px, 7vh, 76px); border-radius: 14px;
  background: var(--panel); border: 1px solid var(--line); overflow: hidden;
}
.zone { position: absolute; top: 0; bottom: 0; left: 45%; width: 10%; background: color-mix(in srgb, var(--ok) 22%, transparent); }
.tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.needle {
  position: absolute; top: 4px; bottom: 4px; left: 50%; width: 10px; margin-left: -5px; border-radius: 5px;
  background: var(--state); transition: left .09s linear; opacity: .35;
}
body[data-state="flat"] .needle, body[data-state="ok"] .needle, body[data-state="sharp"] .needle { opacity: 1; }
.scale { display: flex; justify-content: space-between; margin-top: 6px; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }

/* 하단 */
.foot { display: flex; flex-direction: column; gap: 8px; }
.actions { display: flex; gap: 8px; }
.go {
  flex: 1; min-height: 58px; border: 0; border-radius: 16px; font: inherit; font-size: 1.2rem; font-weight: 800;
  background: var(--brass); color: #1a1405; cursor: pointer;
}
.go[data-on="true"] { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
.rec {
  min-height: 58px; padding: 0 18px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--panel); color: var(--text); font: inherit; font-size: 1.05rem; font-weight: 800; cursor: pointer;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.rec::before { content: "●"; color: var(--sharp); margin-right: .4em; }
.rec[data-on="true"] { background: var(--sharp); border-color: var(--sharp); color: #1f0a03; }
.rec[data-on="true"]::before { content: "■"; color: inherit; }
.take {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 6px 6px 6px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
  font-variant-numeric: tabular-nums;
}
.btn {
  min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel); color: var(--text); font: inherit; font-weight: 700; cursor: pointer;
}
.btn.primary { background: var(--brass); border-color: var(--brass); color: #1a1405; }
.btn.small { min-height: 44px; min-width: 56px; padding: 0 8px; font-variant-numeric: tabular-nums; }
.level { height: 6px; border-radius: 3px; background: var(--panel); overflow: hidden; }
.level i { display: block; height: 100%; width: 0; background: var(--brass); }
.msg { margin: 0; min-height: 1.3em; font-size: .92rem; color: var(--sharp); }
.msg:empty { display: none; }
details { font-size: .85rem; color: var(--muted); }
summary { cursor: pointer; padding: 6px 0; }
details dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
details dt { color: var(--muted); } details dd { margin: 0; color: var(--text); word-break: break-all; }
select { min-height: 40px; max-width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; font: inherit; padding: 0 8px; }

/* 녹음 자세히 보기 */
.detail {
  position: fixed; inset: 0; z-index: 10; background: var(--ink);
  display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
  padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px)
           calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 16px);
}
.detail-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.detail-head h2 { margin: 0; font-size: 1.15rem; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: .85rem; }
.legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.graph-wrap {
  position: relative; flex: 1 1 auto; min-height: 230px;
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel);
}
.graph-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.mask { position: absolute; top: 0; bottom: 0; background: rgba(10, 15, 28, .6); pointer-events: none; }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--text); pointer-events: none; }
.handle { position: absolute; top: 0; bottom: 0; width: 44px; margin-left: -22px; touch-action: none; cursor: ew-resize; }
.handle::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--brass); }
.handle span {
  position: absolute; top: 6px; left: 50%; background: var(--brass); color: #1a1405;
  font-size: .78rem; font-weight: 800; padding: 4px 8px; border-radius: 0 8px 8px 0; white-space: nowrap;
}
#hEnd span { top: auto; bottom: 6px; left: auto; right: 50%; border-radius: 8px 0 0 8px; }
.now { min-height: 1.4em; color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }
.trim { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 6px 8px; font-variant-numeric: tabular-nums; }
.trim .lab { color: var(--muted); font-size: .9rem; }
.trim output { text-align: center; font-size: 1.05rem; font-weight: 700; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.hint { margin: 0; color: var(--muted); font-size: .82rem; }

/* 폰을 가로로 눕혔을 때: 음이름 왼쪽, 게이지 오른쪽 */
@media (orientation: landscape) and (max-height: 540px) {
  body { gap: 6px; }
  .stage { flex-direction: row; align-items: center; gap: 4vw; }
  .readout { flex: 0 0 44%; }
  .gauge { flex: 1; }
  .note { font-size: clamp(5rem, min(24vw, 44vh), 20rem); }
  .note.ko { font-size: calc(clamp(5rem, min(24vw, 44vh), 20rem) * .8); }
  .foot { flex-direction: row; align-items: center; flex-wrap: wrap; }
  .actions { flex: 1 1 280px; }
  .go, .rec { min-height: 48px; font-size: 1rem; }
  .take { flex: 1 1 220px; }
  .level, .msg, details { flex-basis: 100%; }
  .graph-wrap { min-height: 150px; }
}
@media (prefers-reduced-motion: reduce) { .needle, body { transition: none; } }
</style>
</head>

<script>
/*DETECT-START*/
// 정규화 자기상관(McLeod 방식)으로 기본 주파수를 찾는다. 배음이 강한 금관에서도 옥타브 오인식이 적다.
function detectPitch(buf, sampleRate) {
  var n = buf.length, i, tau, rms = 0;
  for (i = 0; i < n; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / n);
  if (rms < 0.006) return { freq: 0, clarity: 0, rms: rms };

  var minTau = Math.floor(sampleRate / 1600);
  var maxTau = Math.min(Math.ceil(sampleRate / 65), n >> 1);
  var w = n - maxTau;
  var nsdf = new Float32Array(maxTau + 1);
  for (tau = 0; tau <= maxTau; tau++) {
    var acf = 0, m = 0;
    for (i = 0; i < w; i++) { var a = buf[i], b = buf[i + tau]; acf += a * b; m += a * a + b * b; }
    nsdf[tau] = m > 0 ? 2 * acf / m : 0;
  }

  // tau=0 주변의 첫 양수 구간을 건너뛴 뒤, 양수 구간마다 최댓값을 모은다.
  tau = 1;
  while (tau <= maxTau && nsdf[tau] > 0) tau++;
  var peaks = [], best = 0;
  while (tau <= maxTau) {
    while (tau <= maxTau && nsdf[tau] <= 0) tau++;
    var pk = -1, pv = 0;
    while (tau <= maxTau && nsdf[tau] > 0) { if (nsdf[tau] > pv) { pv = nsdf[tau]; pk = tau; } tau++; }
    if (pk >= minTau && pk < maxTau) { peaks.push(pk); if (pv > best) best = pv; }
  }
  if (!peaks.length) return { freq: 0, clarity: 0, rms: rms };

  var chosen = peaks[0];
  for (i = 0; i < peaks.length; i++) { if (nsdf[peaks[i]] >= 0.9 * best) { chosen = peaks[i]; break; } }
  var y0 = nsdf[chosen - 1], y1 = nsdf[chosen], y2 = nsdf[chosen + 1];
  var d = y0 - 2 * y1 + y2;
  var shift = d !== 0 ? 0.5 * (y0 - y2) / d : 0;
  return { freq: sampleRate / (chosen + shift), clarity: y1, rms: rms };
}
/*DETECT-END*/

/*WAV-START*/
// 16비트 모노 PCM 구간을 WAV 파일로 만든다.
function wavBlob(pcm, rate, startSec, endSec) {
  var s = Math.max(0, Math.floor(startSec * rate));
  var e = Math.min(pcm.length, Math.ceil(endSec * rate));
  if (e < s) e = s;
  var bytes = (e - s) * 2;
  var h = new DataView(new ArrayBuffer(44));
  function tag(o, t) { for (var i = 0; i < 4; i++) h.setUint8(o + i, t.charCodeAt(i)); }
  tag(0, 'RIFF'); h.setUint32(4, 36 + bytes, true); tag(8, 'WAVE'); tag(12, 'fmt ');
  h.setUint32(16, 16, true); h.setUint16(20, 1, true); h.setUint16(22, 1, true);
  h.setUint32(24, rate, true); h.setUint32(28, rate * 2, true); h.setUint16(32, 2, true); h.setUint16(34, 16, true);
  tag(36, 'data'); h.setUint32(40, bytes, true);
  return new Blob([h.buffer, pcm.subarray(s, e)], { type: 'audio/wav' });
}
/*WAV-END*/

(function () {
  var LETTER = ['C','C','D','E','E','F','F','G','A','A','B','B'];
  var KO     = ['도','도','레','미','미','파','파','솔','라','라','시','시'];
  var ACC    = ['','♯','','♭','','','♯','','♭','','♭',''];
  var SAY    = ['도','도 샵','레','미 플랫','미','파','파 샵','솔','라 플랫','라','시 플랫','시'];
  var IN_TUNE = 5;            // ±5센트 안이면 정확
  var MAX_REC_SEC = 600;      // 녹음은 최대 10분
  var $ = function (id) { return document.getElementById(id); };

  var a4 = 440, written = true, solfege = true, voice = false;
  var ctx = null, stream = null, analyser = null, proc = null, buf = null, raf = 0, wake = null, running = false;
  var hist = [], lastHeard = 0, lastAnalysis = 0;
  var stableNote = null, stableSince = 0, spokenKey = '', spokenAt = 0;

  // 녹음 상태
  var recording = false, pendingRec = false, recChunks = [], recSamples = 0, recRate = 48000, recT = [], recF = [];
  var take = null;            // { pcm, rate, dur, t, f, env, start, end }
  var player = new Audio(), playUrl = '', playDirty = true, playRaf = 0, dragging = null;

  try {
    var s = JSON.parse(localStorage.getItem('tpTuner') || '{}');
    if (s.a4 >= 430 && s.a4 <= 450) a4 = s.a4;
    if (typeof s.written === 'boolean') written = s.written;
    if (typeof s.solfege === 'boolean') solfege = s.solfege;
  } catch (e) {}
  function save() { try { localStorage.setItem('tpTuner', JSON.stringify({ a4: a4, written: written, solfege: solfege })); } catch (e) {} }

  var inFrame = false;
  try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
  var hasApi = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  $('dHost').textContent = location.protocol + '//' + (location.host || '(파일)');
  $('dSecure').textContent = window.isSecureContext ? '예' : '아니오';
  $('dApi').textContent = hasApi ? '예' : '아니오';
  $('dFrame').textContent = inFrame ? '예 (마이크가 막힐 수 있음)' : '아니오';

  function nameOf(pc, ko) { return (ko ? KO : LETTER)[pc] + ACC[pc]; }
  function mod12(n) { return ((n % 12) + 12) % 12; }
  function fmt(t) {
    var m = Math.floor(t / 60), sec = t - m * 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec.toFixed(1);
  }
  function fmtShort(t) { var m = Math.floor(t / 60), sec = Math.floor(t - m * 60); return m + ':' + (sec < 10 ? '0' : '') + sec; }

  function paintSettings() {
    $('a4out').textContent = 'A ' + a4;
    $('nameBtn').textContent = solfege ? '도레미' : 'CDE';
    $('nameBtn').setAttribute('aria-pressed', String(solfege));
    $('modeBtn').textContent = written ? '기보음' : '실음';
    $('modeBtn').setAttribute('aria-pressed', String(written));
    $('voiceBtn').textContent = voice ? '음성 켬' : '음성 끔';
    $('voiceBtn').setAttribute('aria-pressed', String(voice));
    $('note').classList.toggle('ko', solfege);
  }
  paintSettings();

  $('a4down').onclick = function () { if (a4 > 430) { a4--; hist = []; save(); paintSettings(); } };
  $('a4up').onclick   = function () { if (a4 < 450) { a4++; hist = []; save(); paintSettings(); } };
  $('nameBtn').onclick = function () { solfege = !solfege; save(); paintSettings(); };
  $('modeBtn').onclick = function () { written = !written; save(); paintSettings(); };
  $('voiceBtn').onclick = function () {
    voice = !voice; paintSettings();
    if (!('speechSynthesis' in window)) { voice = false; paintSettings(); say('이 브라우저는 음성 안내를 지원하지 않습니다.'); return; }
    if (voice) speak('음성 안내 켬');   // 탭 안에서 한 번 말해 두어야 iOS에서 이후 안내가 나온다
    else speechSynthesis.cancel();
  };

  function say(text) { $('msg').textContent = text || ''; }
  function setState(st) { document.body.setAttribute('data-state', st); }

  function speak(text) {
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; u.rate = 1.1;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  function median(arr) {
    var a = arr.slice().sort(function (x, y) { return x - y; });
    return a[a.length >> 1];
  }

  function showPitch(freq, now) {
    var m = 69 + 12 * Math.log(freq / a4) / Math.LN2;
    if (hist.length && Math.abs(m - median(hist)) > 0.8) hist = [];
    hist.push(m); if (hist.length > 5) hist.shift();
    var mm = median(hist);
    var nearest = Math.round(mm);
    var cents = (mm - nearest) * 100;
    var shown = nearest + (written ? 2 : 0);
    var pc = mod12(shown), cpc = mod12(nearest);
    var oct = Math.floor(shown / 12) - 1;

    $('noteLetter').textContent = (solfege ? KO : LETTER)[pc];
    $('noteAcc').textContent = ACC[pc];
    $('noteOct').textContent = oct;
    // 보조 줄에는 반대 표기를 함께 보여 주어 도레미와 알파벳을 같이 익힐 수 있게 한다.
    var other = nameOf(pc, !solfege) + oct;
    var concert = nameOf(cpc, solfege) + (Math.floor(nearest / 12) - 1);
    $('sub').textContent = other + (written ? ' · 실음 ' + concert : '') + ' · ' + freq.toFixed(1) + ' Hz';

    var r = Math.round(cents);
    $('cents').textContent = (r > 0 ? '+' : r < 0 ? '−' : '') + Math.abs(r);
    $('needle').style.left = (50 + Math.max(-50, Math.min(50, cents))) + '%';
    var st = Math.abs(cents) <= IN_TUNE ? 'ok' : cents < 0 ? 'flat' : 'sharp';
    setState(st);
    $('verdict').textContent = st === 'ok' ? '정확' : st === 'flat' ? '낮음' : '높음';

    if (stableNote !== nearest) { stableNote = nearest; stableSince = now; }
    if (voice && now - stableSince > 800 && now - spokenAt > 2500) {
      var key = nearest + st;
      if (key !== spokenKey) {
        spokenKey = key; spokenAt = now;
        speak(SAY[pc] + ', ' + (st === 'ok' ? '정확' : st === 'flat' ? '낮아요' : '높아요'));
      }
    }
  }

  function loop(now) {
    if (!running) return;
    raf = requestAnimationFrame(loop);
    if (now - lastAnalysis < 45) return;
    lastAnalysis = now;
    if (recording) $('recBtn').textContent = '녹음 끝 ' + fmtShort(recSamples / recRate);
    // 음성 안내가 나오는 동안은 그 소리를 음정으로 잡지 않도록 분석을 쉰다.
    if (voice && window.speechSynthesis && speechSynthesis.speaking) return;

    analyser.getFloatTimeDomainData(buf);
    var p = detectPitch(buf, ctx.sampleRate);
    $('levelBar').style.width = Math.min(100, Math.round(p.rms * 400)) + '%';
    var voiced = p.freq > 60 && p.freq < 1600 && p.clarity > 0.88;

    if (recording) {          // 분석 창의 중심 시각에 음높이를 기록한다
      recT.push(Math.max(0, recSamples / recRate - 0.04));
      recF.push(voiced ? p.freq : 0);
    }

    if (voiced) {
      lastHeard = now;
      showPitch(p.freq, now);
    } else if (now - lastHeard > 450) {
      setState('listening');
      $('verdict').textContent = '소리 대기';
      hist = []; stableNote = null; spokenKey = '';
    }
  }

  function explain(err) {
    var name = err && err.name ? err.name : String(err);
    $('dErr').textContent = name + (err && err.message ? ' · ' + err.message : '');
    if (name === 'NotAllowedError' || name === 'SecurityError') {
      return inFrame
        ? '이 페이지가 다른 페이지 안에 끼워져 있어 마이크가 막혔습니다. 이 파일의 주소를 Safari에서 직접 여세요.'
        : '마이크가 거부됐습니다. 주소창의 웹사이트 설정에서 마이크를 허용으로 바꾼 뒤 다시 누르세요.';
    }
    if (name === 'NotFoundError' || name === 'OverconstrainedError') return '마이크를 찾지 못했습니다. 아래 진단에서 다른 마이크를 고르거나 블루투스 연결을 확인하세요.';
    if (name === 'NotReadableError') return '다른 앱이 마이크를 쓰고 있습니다. 그 앱을 닫고 다시 누르세요.';
    return '마이크를 시작하지 못했습니다 (' + name + ').';
  }

  function fillMics() {
    if (!navigator.mediaDevices.enumerateDevices) return;
    navigator.mediaDevices.enumerateDevices().then(function (list) {
      var sel = $('micSel'), cur = sel.value;
      sel.length = 1;
      list.forEach(function (d) {
        if (d.kind !== 'audioinput') return;
        var o = document.createElement('option');
        o.value = d.deviceId; o.textContent = d.label || '마이크';
        sel.appendChild(o);
      });
      sel.value = cur;
    }).catch(function () {});
  }

  function requestWake() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (w) { wake = w; }).catch(function () {});
  }

  function start() {
    say('');
    if (!window.isSecureContext) { pendingRec = false; say('https 주소가 아니어서 마이크를 쓸 수 없습니다. https 주소로 여세요.'); return; }
    if (!hasApi) { pendingRec = false; say('이 브라우저는 마이크를 지원하지 않습니다. Safari나 Chrome에서 직접 여세요.'); return; }

    var AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();              // 탭 직후에 만들어야 iOS에서 오디오가 깨어난다
    var audio = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
    var id = $('micSel').value;
    if (id) audio.deviceId = { exact: id };

    navigator.mediaDevices.getUserMedia({ audio: audio, video: false }).then(function (st) {
      stream = st;
      if (ctx.state === 'suspended') ctx.resume();
      analyser = ctx.createAnalyser();
      analyser.fftSize = 4096;
      analyser.smoothingTimeConstant = 0;
      buf = new Float32Array(analyser.fftSize);
      var src = ctx.createMediaStreamSource(stream);
      var mute = ctx.createGain(); mute.gain.value = 0;
      src.connect(analyser); analyser.connect(mute); mute.connect(ctx.destination);

      if (ctx.createScriptProcessor) {       // 녹음용: 마이크 원음을 그대로 모은다
        proc = ctx.createScriptProcessor(4096, 1, 1);
        proc.onaudioprocess = function (e) {
          if (!recording) return;
          var inp = e.inputBuffer.getChannelData(0), out = new Int16Array(inp.length);
          for (var i = 0; i < inp.length; i++) { var v = inp[i]; out[i] = (v < -1 ? -1 : v > 1 ? 1 : v) * 32767; }
          recChunks.push(out); recSamples += out.length;
          if (recSamples >= MAX_REC_SEC * recRate) setTimeout(stopRec, 0);
        };
        src.connect(proc); proc.connect(mute);
      }

      running = true; hist = []; lastHeard = 0;
      $('goBtn').textContent = '튜너 정지'; $('goBtn').setAttribute('data-on', 'true');
      $('dRate').textContent = ctx.sampleRate + ' Hz';
      $('dErr').textContent = '없음';
      setState('listening'); $('verdict').textContent = '소리 대기';
      $('sub').textContent = '한 음을 길게 불어주세요';
      fillMics(); requestWake();
      raf = requestAnimationFrame(loop);
      if (pendingRec) { pendingRec = false; startRec(); }
    }).catch(function (err) {
      pendingRec = false;
      say(explain(err));
      try { ctx.close(); } catch (e) {}
      ctx = null;
    });
  }

  function stop() {
    if (recording) stopRec();
    running = false; cancelAnimationFrame(raf);
    if (proc) { proc.onaudioprocess = null; }
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    if (ctx) { try { ctx.close(); } catch (e) {} }
    if (wake) { try { wake.release(); } catch (e) {} }
    if (window.speechSynthesis) speechSynthesis.cancel();
    stream = ctx = analyser = proc = wake = null;
    $('goBtn').textContent = '튜너 시작'; $('goBtn').setAttribute('data-on', 'false');
    $('levelBar').style.width = '0';
    setState('idle'); $('verdict').textContent = '대기';
  }

  /* ---------- 녹음 ---------- */
  function startRec() {
    if (!running) { pendingRec = true; start(); return; }
    if (!proc) { say('이 브라우저에서는 녹음을 지원하지 않습니다.'); return; }
    recChunks = []; recSamples = 0; recT = []; recF = []; recRate = ctx.sampleRate;
    recording = true;
    $('recBtn').setAttribute('data-on', 'true'); $('recBtn').textContent = '녹음 끝 0:00';
  }

  function stopRec() {
    if (!recording) return;
    recording = false;
    $('recBtn').setAttribute('data-on', 'false'); $('recBtn').textContent = '녹음';
    var pcm = new Int16Array(recSamples), off = 0;
    for (var i = 0; i < recChunks.length; i++) { pcm.set(recChunks[i], off); off += recChunks[i].length; }
    recChunks = [];
    var dur = recSamples / recRate;
    if (dur < 0.3) { say('녹음이 너무 짧습니다.'); return; }
    setTake(pcm, recRate, recT, recF);
  }

  function setTake(pcm, rate, t, f) {
    var dur = pcm.length / rate, bins = 1000, env = new Float32Array(bins), step = pcm.length / bins;
    for (var b = 0; b < bins; b++) {
      var from = Math.floor(b * step), to = Math.floor((b + 1) * step), pk = 0;
      for (var i = from; i < to; i += 8) { var v = pcm[i] < 0 ? -pcm[i] : pcm[i]; if (v > pk) pk = v; }
      env[b] = pk / 32768;
    }
    take = { pcm: pcm, rate: rate, dur: dur, t: t, f: f, env: env, start: 0, end: dur };
    playDirty = true;
    $('takeInfo').textContent = '녹음 ' + fmtShort(dur);
    $('takeRow').hidden = false;
  }

  $('recBtn').onclick = function () { say(''); if (recording) stopRec(); else startRec(); };

  /* ---------- 자세히 보기 ---------- */
  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  function drawTake() {
    if (!take) return;
    var wrap = $('graphWrap'), cv = $('graph');
    var W = wrap.clientWidth, H = wrap.clientHeight, dpr = window.devicePixelRatio || 1;
    if (!W || !H) return;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    var g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    var cLine = cssVar('--line'), cMuted = cssVar('--muted'), cPanel = cssVar('--panel'), cText = cssVar('--text');
    var cOk = cssVar('--ok'), cFlat = cssVar('--flat'), cSharp = cssVar('--sharp');
    var volH = Math.round(H * 0.15), plotH = H - volH - 6;
    var shift = written ? 2 : 0, n = take.t.length, i;

    var md = new Float32Array(n), lo = Infinity, hi = -Infinity;
    for (i = 0; i < n; i++) {
      md[i] = take.f[i] > 0 ? 69 + 12 * Math.log(take.f[i] / a4) / Math.LN2 + shift : NaN;
      if (md[i] === md[i]) { if (md[i] < lo) lo = md[i]; if (md[i] > hi) hi = md[i]; }
    }
    var empty = lo === Infinity;
    if (empty) { lo = 60; hi = 72; }
    lo = Math.floor(lo) - 1.5; hi = Math.ceil(hi) + 1.5;
    if (hi - lo < 8) { var mid = (hi + lo) / 2; lo = mid - 4; hi = mid + 4; }
    function Y(m) { return plotH - (m - lo) / (hi - lo) * plotH; }
    function X(t) { return t / take.dur * W; }
    var rowH = plotH / (hi - lo);

    // 음높이 줄과 음이름
    g.font = '11px ' + cssVar('--body'); g.textBaseline = 'middle';
    for (var k = Math.ceil(lo); k <= Math.floor(hi); k++) {
      var y = Y(k), pc = mod12(k), natural = ACC[pc] === '';
      g.strokeStyle = cLine; g.globalAlpha = natural ? 0.9 : 0.4; g.lineWidth = 1;
      g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
      g.globalAlpha = 1;
      if (rowH >= 13 || (natural && rowH >= 7) || pc === 0) {
        var label = nameOf(pc, solfege) + (pc === 0 ? (Math.floor(k / 12) - 1) : '');
        var tw = g.measureText(label).width;
        g.fillStyle = cPanel; g.fillRect(2, y - 7, tw + 8, 14);
        g.fillStyle = cText; g.fillText(label, 6, y);
      }
    }

    // 음높이 선: 가까운 음에서 벗어난 정도에 따라 색을 칠한다
    g.lineWidth = 3; g.lineCap = 'round';
    for (i = 0; i < n; i++) {
      if (md[i] !== md[i]) continue;
      var c = (md[i] - Math.round(md[i])) * 100;
      var col = Math.abs(c) <= IN_TUNE ? cOk : c < 0 ? cFlat : cSharp;
      var x1 = X(take.t[i]), y1 = Y(md[i]);
      g.strokeStyle = col; g.fillStyle = col;
      if (i > 0 && md[i - 1] === md[i - 1] && Math.abs(md[i] - md[i - 1]) < 0.7 && take.t[i] - take.t[i - 1] < 0.15) {
        g.beginPath(); g.moveTo(X(take.t[i - 1]), Y(md[i - 1])); g.lineTo(x1, y1); g.stroke();
      } else {
        g.beginPath(); g.arc(x1, y1, 1.8, 0, 6.2832); g.fill();
      }
    }
    if (empty) {
      g.fillStyle = cMuted; g.font = '14px ' + cssVar('--body'); g.textAlign = 'center';
      g.fillText('감지된 음이 없습니다', W / 2, plotH / 2); g.textAlign = 'left';
    }

    // 소리 크기 띠
    g.fillStyle = cMuted; g.globalAlpha = 0.55;
    var bins = take.env.length, bw = Math.max(1, W / bins);
    for (i = 0; i < bins; i++) {
      var h = Math.max(1, Math.min(1, take.env[i] * 3) * volH);
      g.fillRect(i / bins * W, H - h, bw, h);
    }
    g.globalAlpha = 1;
  }

  function paintTrim() {
    if (!take) return;
    var a = take.start / take.dur * 100, b = take.end / take.dur * 100;
    $('hStart').style.left = a + '%'; $('hEnd').style.left = b + '%';
    $('maskL').style.width = a + '%'; $('maskR').style.width = (100 - b) + '%';
    $('sOut').textContent = fmt(take.start); $('eOut').textContent = fmt(take.end);
    $('saveBtn').textContent = '잘라서 저장 (' + fmt(take.end - take.start) + ')';
  }

  function setTrim(which, t) {
    if (!take) return;
    var gap = Math.min(0.2, take.dur);
    if (which === 'start') take.start = Math.max(0, Math.min(t, take.end - gap));
    else take.end = Math.min(take.dur, Math.max(t, take.start + gap));
    playDirty = true; stopPlay(); paintTrim();
  }

  function bindHandle(el, which) {
    el.addEventListener('pointerdown', function (e) {
      dragging = which; try { el.setPointerCapture(e.pointerId); } catch (x) {}
      e.preventDefault();
    });
    el.addEventListener('pointermove', function (e) {
      if (dragging !== which || !take) return;
      var r = $('graphWrap').getBoundingClientRect();
      setTrim(which, (e.clientX - r.left) / r.width * take.dur);
    });
    var end = function () { if (dragging === which) dragging = null; };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.addEventListener('keydown', function (e) {
      if (!take) return;
      var cur = which === 'start' ? take.start : take.end;
      if (e.key === 'ArrowLeft') { setTrim(which, cur - 0.1); e.preventDefault(); }
      if (e.key === 'ArrowRight') { setTrim(which, cur + 0.1); e.preventDefault(); }
    });
  }
  bindHandle($('hStart'), 'start'); bindHandle($('hEnd'), 'end');
  $('sMinus').onclick = function () { setTrim('start', take.start - 0.1); };
  $('sPlus').onclick  = function () { setTrim('start', take.start + 0.1); };
  $('eMinus').onclick = function () { setTrim('end', take.end - 0.1); };
  $('ePlus').onclick  = function () { setTrim('end', take.end + 0.1); };

  $('autoTrim').onclick = function () {
    if (!take) return;
    var first = -1, last = -1;
    for (var i = 0; i < take.f.length; i++) if (take.f[i] > 0) { if (first < 0) first = i; last = i; }
    if (first < 0) { $('nowNote').textContent = '감지된 음이 없어 자동으로 자를 수 없습니다.'; return; }
    take.start = 0; take.end = take.dur;
    setTrim('end', take.t[last] + 0.4); setTrim('start', take.t[first] - 0.25);
    $('nowNote').textContent = '첫 음 직전부터 마지막 음 직후까지 남겼습니다.';
  };
  $('resetTrim').onclick = function () {
    if (!take) return;
    take.start = 0; take.end = take.dur; playDirty = true; stopPlay(); paintTrim();
  };

  function noteAt(t) {
    var best = -1, bd = 0.12;
    for (var i = 0; i < take.t.length; i++) {
      var d = Math.abs(take.t[i] - t);
      if (d < bd) { bd = d; best = i; }
      if (take.t[i] > t + 0.12) break;
    }
    if (best < 0 || !(take.f[best] > 0)) return '–';
    var m = 69 + 12 * Math.log(take.f[best] / a4) / Math.LN2, nr = Math.round(m), c = Math.round((m - nr) * 100);
    var shown = nr + (written ? 2 : 0);
    return nameOf(mod12(shown), solfege) + (Math.floor(shown / 12) - 1) + ' ' + (c > 0 ? '+' : c < 0 ? '−' : '') + Math.abs(c);
  }

  function tickPlay() {
    if (player.paused || !take) return;
    var t = take.start + player.currentTime;
    $('playhead').style.left = (t / take.dur * 100) + '%';
    $('nowNote').textContent = fmt(t) + ' · ' + noteAt(t);
    playRaf = requestAnimationFrame(tickPlay);
  }
  function stopPlay() { if (!player.paused) player.pause(); }
  player.addEventListener('pause', function () { cancelAnimationFrame(playRaf); $('playhead').hidden = true; $('playBtn').textContent = '구간 재생'; });
  player.addEventListener('ended', function () { $('playhead').hidden = true; $('playBtn').textContent = '구간 재생'; });

  $('playBtn').onclick = function () {
    if (!take) return;
    if (!player.paused) { player.pause(); return; }
    if (playDirty) {
      if (playUrl) URL.revokeObjectURL(playUrl);
      playUrl = URL.createObjectURL(wavBlob(take.pcm, take.rate, take.start, take.end));
      player.src = playUrl; playDirty = false;
    }
    try { player.currentTime = 0; } catch (e) {}
    var p = player.play();
    $('playhead').hidden = false; $('playBtn').textContent = '재생 정지';
    playRaf = requestAnimationFrame(tickPlay);
    if (p && p.catch) p.catch(function () { $('nowNote').textContent = '재생을 시작하지 못했습니다. 다시 눌러 주세요.'; });
  };

  $('saveBtn').onclick = function () {
    if (!take) return;
    var d = new Date(), z = function (n) { return (n < 10 ? '0' : '') + n; };
    var name = 'trumpet-' + d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '-' + z(d.getHours()) + z(d.getMinutes()) + '.wav';
    var blob = wavBlob(take.pcm, take.rate, take.start, take.end);
    var file = null;
    try { file = new File([blob], name, { type: 'audio/wav' }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).then(function () {
        $('saveHint').textContent = name + ' 파일을 내보냈습니다.';
      }).catch(function (err) {
        if (err && err.name !== 'AbortError') download(blob, name);
      });
    } else download(blob, name);
  };
  function download(blob, name) {
    var a = document.createElement('a'), url = URL.createObjectURL(blob);
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    $('saveHint').textContent = name + ' 파일로 내려받았습니다. "파일" 앱의 다운로드 폴더에 있습니다.';
  }

  function openDetail() {
    if (!take) return;
    if (running) stop();      // 재생 소리를 튜너가 다시 듣지 않도록 마이크를 끈다
    $('detail').hidden = false;
    $('nowNote').textContent = '노란 선을 끌어 남길 구간을 정하세요';
    drawTake(); paintTrim();
  }
  $('openDetail').onclick = openDetail;
  $('closeDetail').onclick = function () { stopPlay(); $('detail').hidden = true; };
  window.addEventListener('resize', function () { if (!$('detail').hidden) drawTake(); });

  $('goBtn').onclick = function () { if (running) stop(); else start(); };
  $('micSel').onchange = function () { if (running) { stop(); start(); } };
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && running) {
      requestWake();
      if (ctx && ctx.state === 'suspended') ctx.resume();
    }
  });

  // #demo 로 열면 합성한 예시 녹음(도레미파솔)으로 자세히 보기 화면을 확인할 수 있다.
  if (location.hash === '#demo') {
    var rate = 48000, notes = [58, 60, 62, 63, 65], pcm = new Int16Array(rate * 6), t = [], f = [], ph = 0;
    for (var i = 0; i < pcm.length; i++) {
      var sec = i / rate, idx = Math.floor((sec - 0.8) / 0.9);
      var on = sec > 0.8 && idx < notes.length && (sec - 0.8) % 0.9 < 0.75;
      var fr = on ? 440 * Math.pow(2, (notes[idx] - 69 + (idx - 2) * 0.06) / 12) : 0;
      ph += 2 * Math.PI * fr / rate;
      pcm[i] = on ? Math.sin(ph) * 9000 : 0;
      if (i % 2160 === 0) { t.push(sec); f.push(fr); }
    }
    setTake(pcm, rate, t, f);
    openDetail();
  }
})();
</script>
